sentence=Least-squares line (slope and intercept) over the last n points, updated in constant time per point.
paragraph=Each new point costs the same whatever the window size. Sums are kept relative to a moving reference and refreshed every n points, so large time stamps such as millis() and long runs stay accurate. Needs the RngBuffer library.
